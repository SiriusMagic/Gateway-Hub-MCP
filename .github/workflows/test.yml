name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK and native build tools
        shell: bash
        run: |
          sdkmanager_path="$(command -v sdkmanager || printf '%s' "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          set +o pipefail
          yes | "$sdkmanager_path" 'platforms;android-36' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug
