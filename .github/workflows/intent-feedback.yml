name: Revisar feedback de intenciones
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: intent-feedback
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    if: ${{ vars.FEEDBACK_API_URL != '' && vars.LLM_API_URL != '' && vars.LLM_MODEL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar SDK Android
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager 'platforms;android-36' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - run: npm ci
      - name: Revisar lote de la cola privada
        env:
          FEEDBACK_API_URL: ${{ vars.FEEDBACK_API_URL }}
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          FEEDBACK_REVIEW_TOKEN: ${{ secrets.FEEDBACK_REVIEW_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node --experimental-strip-types scripts/intent-review.ts
