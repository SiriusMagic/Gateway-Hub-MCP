# Publishes the hub to Cloudflare on every push to main, after the tests pass. Needs two repository secrets
# (GitHub › Settings › Secrets and variables › Actions): CLOUDFLARE_API_TOKEN («Edit Cloudflare Workers» template)
# and CLOUDFLARE_ACCOUNT_ID. Without them the job says so and does nothing. Can also be run by hand (Actions › deploy).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Publish to Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to publish the hub."
            exit 0
          fi
          npx wrangler deploy
